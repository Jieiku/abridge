{% component youtube(id, class="", title="", playlist="", autoplay=false, cookie=false) %}
<div class="yv{% if class %} {{class}}{% endif %}">
    <iframe src="https://www.youtube{% if not cookie %}-nocookie{% endif %}.com/embed/{{id}}{% if playlist or autoplay %}?{% endif %}{% if playlist %}list={{playlist}}{% endif %}{% if playlist and autoplay %}&{% endif %}{% if autoplay %}autoplay=1{% endif %}" title="{{ title if title else 'Youtube' }}" class="yvi" webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe>
</div>
{% endcomponent youtube %}
