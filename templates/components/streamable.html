{% component streamable(id, class="", title="") %}
<div class="yv{% if class %} {{class}}{% endif %}">
    <iframe src="https://www.streamable.com/e/{{id}}" title="{{ title if title else 'Streamable' }}" class="yvi" webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe>
</div>
{% endcomponent streamable %}
