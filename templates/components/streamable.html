{% component streamable(id, class="", title="") %}
<div class="yv{% if class %} {{class}}{% endif %}">
    <lite-streamable videoid="{{ id }}" videotitle="{{ title if title else 'Streamable' }}">
        <img slot="image" src="{{ get_url(path='img/embed/streamable/' ~ id ~ '-1280.jpg', trailing_slash=false, cachebust=true) | safe }}" alt="" loading="lazy">
    </lite-streamable>
</div>
{% endcomponent streamable %}
